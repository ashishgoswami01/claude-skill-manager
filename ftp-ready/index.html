<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Blog</title>
  <meta name="description" content="A modern blog" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <a href="index.html" class="nav-logo">My <span>Blog</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="admin/" class="nav-btn">Admin Panel ↗</a>
    </div>
  </div>
</nav>

<section class="hero">
  <div class="hero-tag">Latest Stories</div>
  <h1>Ideas Worth<br><span>Sharing.</span></h1>
  <p>Explore articles, tutorials, and thoughts on design, technology, and everything in between.</p>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search posts…" autocomplete="off" />
    <button>Search</button>
  </div>
</section>

<div class="tags-bar" id="tagBar"></div>

<section class="posts-sec">
  <div class="posts-top">
    <h2>Latest Posts</h2>
    <span class="cnt" id="postsCount"></span>
  </div>
  <div class="posts-grid" id="postsGrid">
    <div class="loading"><div class="spinner"></div></div>
  </div>
  <div class="pagination" id="pagination"></div>
</section>

<footer class="footer">
  <p>© 2026 My Blog &nbsp;·&nbsp; <a href="admin/">Admin Panel</a></p>
</footer>

<script src="assets/js/blog.js"></script>
</body>
</html>
